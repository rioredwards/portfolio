name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Run typecheck
        run: bun run build
        env:
          # Skip actual deployment, just verify build succeeds
          SKIP_ENV_VALIDATION: true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Run Playwright tests
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  visual:
    name: Visual snapshots → PR branch
    # Regenerates e2e/__screenshots__ in a pinned Linux container and commits
    # them to the PR branch so GitHub's image diff shows UI changes. Never
    # fails on pixel diffs; GITHUB_TOKEN pushes don't re-trigger CI.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.1-noble
    permissions:
      contents: write
    env:
      HUSKY: 0
      SKIP_ENV_VALIDATION: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      # Checkout inside a container leaves the workspace owned by another uid.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # setup-bun needs unzip, which the Playwright image lacks; npm is there.
      - name: Setup Bun
        run: npm install -g bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture screenshots
        run: bunx playwright test --grep @visual --project chromium --project "Mobile Chrome" --update-snapshots
        env:
          VISUAL: 1

      - name: Commit updated screenshots
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(visual): update screenshots"
          file_pattern: e2e/__screenshots__/**
